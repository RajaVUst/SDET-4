name: UI and API Automation Tests

on:
  push:
    branches:
      - capstone/299174-monisha
      

  pull_request:
    branches:
      - capstone/299174-monisha

  workflow_dispatch:

jobs:
  ui-tests:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: echo "BASE_URL=${{ secrets.Monisha_BASE_URL }}" > .env

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.Monisha_BASE_URL }}
        run: npx playwright test --reporter=html,list

      - name: Upload UI Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: UI/playwright-report
          if-no-files-found: warn

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UI/test-results
          if-no-files-found: warn

  api-tests:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API_final

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.API_BASE_URL }}" > .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env

      - name: Run API tests
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: mvn clean test

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload API Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: API_final/target/site/allure-maven
          if-no-files-found: warn

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: API_final/target/surefire-reports
          if-no-files-found: warn
