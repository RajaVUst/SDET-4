name: Playwright CI

on:
  push:
    branches:
      - capstone/304579-lahari
  pull_request:
    branches:
      - capstone/304579-lahari

jobs:
  playwright:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.LAHARI_BASE_URL }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/

  api:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.Lahari_APIURL }}" >> .env
          echo "USERNAME=${{ secrets.Lahari_USERNAME }}" >> .env
          echo "PASSWORD=${{ secrets.Lahari_PASSWORD }}" >> .env

      - name: Run API Tests
        run: mvn clean test

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: api/target/site/allure-maven-plugin