name: Playwright UI Tests

on:
  push:
    branches: [main]
  

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    # Everything runs inside the UIAutomation folder,
    # so this workflow only ever touches the Playwright project.
    defaults:
      run:
        working-directory: ./UIAutomation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: echo "BASE_URL=https://chess-agent-83252463.figma.site" > .env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Set up Java (needed for Allure report)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: UIAutomation/allure-report/

      - name: Upload Playwright test results (screenshots/videos/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: UIAutomation/test-results/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: UIAutomation/logs/