name: UI and API Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./UIAutomation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env file
        run: echo "BASE_URL=${{ secrets.BASE_URL }}" > .env

      - name: Run Playwright tests
        run: npx playwright test

      - name: Set up Java (needed for Allure report)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload UI Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-report
          path: UIAutomation/allure-report/

      - name: Upload UI test results (screenshots/videos/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UIAutomation/test-results/

      - name: Upload UI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs
          path: UIAutomation/logs/

  api-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./APIAutomation/API

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run API tests
        env:
          API_BASE_URL: ${{ secrets.jyothsna_API_BASE_URL }}
        run: mvn clean test

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload API Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: APIAutomation/API/target/site/allure-maven-plugin/

      - name: Upload API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: APIAutomation/API/logs/